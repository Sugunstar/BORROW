[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "borrow"
version = "0.1.0"
description = "Claude-Code-style terminal for a self-hosted Qwen coder model (free GPU via Kaggle)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["prompt_toolkit>=3"]

[project.scripts]
borrow = "borrow:run"

[tool.setuptools]
py-modules = ["borrow"]